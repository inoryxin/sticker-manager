# ============================================================
#  表情包管家 · 1Panel「容器 → 编排」完整配置
# ------------------------------------------------------------
#  使用方法：
#    1Panel → 容器 → 编排 → 创建编排 → 名称填 bqb
#    → 把本文件全部内容粘贴进去 → 确认
#
#  访问地址：  http://<你的服务器IP>:13000
#  管理员登录：打开网站 → 左下角「🔒 管理员登录」
# ============================================================

services:
  sticker-manager:

    # 官方 Node 精简镜像，约 50MB（比完整版小 20 倍，拉取快很多）
    image: node:20-alpine

    container_name: sticker-manager

    # 容器内工作目录 = 下面挂载进去的项目目录
    working_dir: /app

    # 本项目零依赖，直接运行即可，不需要 npm install
    command: node server.js

    environment:
      # ★★★ 管理员密码 —— 必须改掉！★★★
      # 设置后：游客只能浏览 / 预览 / 搜索 / 下载；
      #         输入此密码登录后，才能上传、打标签、改分类、删除、导出备份。
      # 留空或删掉这一行 = 不启用鉴权（所有人都能改），不推荐。
      - ADMIN_PASSWORD=请改成你自己的密码

      # 应用监听端口（容器内部），保持 3000 不用改
      - PORT=3000

    ports:
      # 宿主机端口:容器端口 —— 要换端口只改左边那个数字
      - "13000:3000"

    volumes:
      # 项目目录挂载进容器
      #   左边 /home/anzu/BQB = 你放 server.js、public/ 的那个目录，按实际情况改
      #   图片(stickers/)和数据库(data.json)也存在这里，备份直接拷这个目录
      - /home/anzu/BQB:/app

    # 开机自启 + 崩溃自动重启
    restart: unless-stopped

    # 健康检查（可选，让 1Panel 显示容器健康状态）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
